<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Curso de Design | Plataforma de aulas</title>
  <meta name="theme-color" content="#07060d">
  <meta name="color-scheme" content="dark">
  <meta name="description" content="Plataforma de aulas do curso de design: vídeos do YouTube e materiais para download.">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div class="fundo" aria-hidden="true">
    <video class="fundo-video" data-fundo-video poster="/fundo.png" autoplay muted loop playsinline preload="auto" disablepictureinpicture>
      <source src="/fundo.mp4" type="video/mp4">
    </video>
  </div>
  <div class="grain" aria-hidden="true"></div>

  <a class="skip-link" href="#conteudo">Pular para o conteúdo</a>

  <header class="topbar">
    <a class="brand" href="#/">
      <span class="brand-mark" aria-hidden="true">◐</span>
      <span class="brand-text">
        <strong data-brand>Curso de Design</strong>
        <small data-tagline>Plataforma de aulas</small>
      </span>
    </a>
    <nav class="nav">
      <a href="#/" data-nav="aluno">Aluno</a>
      <a href="#/admin" data-nav="admin">Admin</a>
    </nav>
  </header>

  <main id="conteudo" class="app"></main>

  <div id="modal-root"></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script type="module" src="/app.js"></script>
</body>
</html>
